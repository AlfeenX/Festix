global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'festix-gateway'
    static_configs:
      - targets: ['nginx-gateway:3000']
    metrics_path: /metrics

  - job_name: 'festix-auth'
    static_configs:
      - targets: ['auth-service:3001']

  - job_name: 'festix-event'
    static_configs:
      - targets: ['event-service:3002']

  - job_name: 'festix-seat'
    static_configs:
      - targets: ['seat-service:3003']

  - job_name: 'festix-order'
    static_configs:
      - targets: ['order-service:3004']

  - job_name: 'festix-payment'
    static_configs:
      - targets: ['payment-service:3005']

  - job_name: 'festix-notification'
    static_configs:
      - targets: ['notification-service:3006']
