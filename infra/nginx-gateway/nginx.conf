worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Basic rate limiting (per IP)
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

  # Upstreams
  upstream auth_service         { server auth-service:3001; }
  upstream event_service        { server event-service:3002; }
  upstream seat_service         { server seat-service:3003; }
  upstream order_service        { server order-service:3004; }
  upstream payment_service      { server payment-service:3005; }
  upstream notification_service { server notification-service:3006; }

  # CORS origin map — replaces if() in server block
  map $http_origin $cors_origin {
    default "$http_origin";
    ""      "*";
  }

  server {
    listen 3000;

    # Global CORS Headers
    add_header 'Access-Control-Allow-Origin'      $cors_origin always;
    add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type, x-user-id, x-user-role, x-user-email' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Max-Age'           1728000 always;

    error_page 401 = @json_401;
    error_page 403 = @json_403;

    # Handle Preflight
    if ($request_method = OPTIONS) {
      return 204;
    }

    # Default proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Hide CORS headers from upstream to avoid duplication
    proxy_hide_header 'Access-Control-Allow-Origin';
    proxy_hide_header 'Access-Control-Allow-Methods';
    proxy_hide_header 'Access-Control-Allow-Headers';
    proxy_hide_header 'Access-Control-Allow-Credentials';
    proxy_hide_header 'Access-Control-Max-Age';

    # Health
    location = /health {
      return 200 '{"status":"ok","service":"nginx-gateway"}';
    }

    # Metrics
    location = /metrics {
      add_header Content-Type text/plain;
      return 200 "festix_gateway_up 1\n";
    }

    location @json_401 {
      internal;
      default_type application/json;
      return 401 '{"error":"Unauthorized"}';
    }

    location @json_403 {
      internal;
      default_type application/json;
      return 403 '{"error":"Forbidden"}';
    }

    # Internal Auth
    location = /_auth {
      internal;
      proxy_pass http://auth_service/internal/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
    }

    auth_request_set $auth_user_id    $upstream_http_x_user_id;
    auth_request_set $auth_user_role  $upstream_http_x_user_role;
    auth_request_set $auth_user_email $upstream_http_x_user_email;

    # --- API Routes ---

    # Auth
    location /api/auth/ {
      limit_req zone=api_auth burst=20 nodelay;
      proxy_pass http://auth_service/;
    }

    # Events
    location /api/events/ {
      limit_req zone=api_general burst=50 nodelay;
      rewrite ^/api/events(/.*)$ /events$1 break;
      proxy_pass http://event_service;
    }
    location = /api/events {
      limit_req zone=api_general burst=50 nodelay;
      rewrite ^/api/events$ /events break;
      proxy_pass http://event_service;
    }

    # Venues
    location /api/venues/ {
      limit_req zone=api_general burst=50 nodelay;
      rewrite ^/api/venues(/.*)$ /venues$1 break;
      proxy_pass http://event_service;
    }
    location = /api/venues {
      limit_req zone=api_general burst=50 nodelay;
      rewrite ^/api/venues$ /venues break;
      proxy_pass http://event_service;
    }

    # Seats — public seat map
    location ~ ^/api/events/([^/]+)/seats$ {
      limit_req zone=api_general burst=50 nodelay;
      rewrite ^/api/events/([^/]+)/seats$ /events/$1/seats break;
      proxy_pass http://seat_service;
    }

    # Waiting room — requires auth
    location ~ ^/api/waiting-room/([^/]+)/join$ {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/waiting-room(/.*)$ /waiting-room$1 break;
      proxy_pass http://seat_service;
    }

    # Seats — requires auth
    location /api/seats/ {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/seats(/.*)$ /seats$1 break;
      proxy_pass http://seat_service;
    }

    # Checkout
    location /api/checkout/ {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/checkout(/.*)$ /checkout$1 break;
      proxy_pass http://order_service;
    }
    location = /api/checkout {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/checkout$ /checkout break;
      proxy_pass http://order_service;
    }

    # Orders
    location /api/orders/ {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/orders(/.*)$ /orders$1 break;
      proxy_pass http://order_service;
    }
    location = /api/orders {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/orders$ /orders break;
      proxy_pass http://order_service;
    }

    # Payments — pay (requires auth)
    location = /api/payments/pay {
      limit_req zone=api_general burst=20 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/payments/pay$ /pay break;
      proxy_pass http://payment_service;
    }

    # Payments — session (public, no auth)
    location ~ ^/api/payments/session/([^/]+)$ {
      limit_req zone=api_general burst=30 nodelay;
      rewrite ^/api/payments/session/([^/]+)$ /session/$1 break;
      proxy_pass http://payment_service;
    }

    # Payments — confirm (public, no auth)
    location ~ ^/api/payments/([^/]+)/confirm$ {
      limit_req zone=api_general burst=30 nodelay;
      rewrite ^/api/payments/([^/]+)/confirm$ /$1/confirm break;
      proxy_pass http://payment_service;
    }

    # Payments — catch-all (requires auth)
    location /api/payments/ {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/payments(/.*)$ $1 break;
      proxy_pass http://payment_service;
    }

    # Notifications
    location /api/notifications/ {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/notifications(/.*)$ /notifications$1 break;
      proxy_pass http://notification_service;
    }
    location = /api/notifications {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/notifications$ /notifications break;
      proxy_pass http://notification_service;
    }

    # Admin — Events (ADMIN+)
    location /api/admin/events/ {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/admin/events(/.*)$ /events$1 break;
      proxy_pass http://event_service;
    }
    location = /api/admin/events {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/admin/events$ /events break;
      proxy_pass http://event_service;
    }

    # Admin — Stats (ADMIN+)
    location /api/admin/stats/ {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/admin/stats(/.*)$ /admin/stats$1 break;
      proxy_pass http://event_service;
    }
    location = /api/admin/stats {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/admin/stats$ /admin/stats break;
      proxy_pass http://event_service;
    }

    # Admin — Orders (ADMIN+)
    location /api/admin/orders/ {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/admin/orders(/.*)$ /admin/orders$1 break;
      proxy_pass http://order_service;
    }
    location = /api/admin/orders {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/admin/orders$ /admin/orders break;
      proxy_pass http://order_service;
    }

    # Admin — Payments (ADMIN+)
    location /api/admin/payments/ {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/admin/payments(/.*)$ /admin/payments/stats$1 break;
      proxy_pass http://payment_service;
    }
    location = /api/admin/payments {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/admin/payments$ /admin/payments/stats break;
      proxy_pass http://payment_service;
    }

    # Admin — Users (SUPER_ADMIN only)
    location /api/admin/users/ {
      limit_req zone=api_general burst=20 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/admin/users(/.*)$ /admin/users$1 break;
      proxy_pass http://auth_service;
    }
    location = /api/admin/users {
      limit_req zone=api_general burst=20 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/admin/users$ /admin/users break;
      proxy_pass http://auth_service;
    }

    # Admin — Venues (ADMIN+)
    location /api/admin/venues/ {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/admin/venues(/.*)$ /admin/venues$1 break;
      proxy_pass http://event_service;
    }
    location = /api/admin/venues {
      limit_req zone=api_general burst=30 nodelay;
      auth_request /_auth;
      proxy_set_header x-user-id    $auth_user_id;
      proxy_set_header x-user-role  $auth_user_role;
      proxy_set_header x-user-email $auth_user_email;
      rewrite ^/api/admin/venues$ /admin/venues break;
      proxy_pass http://event_service;
    }

    # Fallback
    location / {
      return 404;
    }
  }
}
