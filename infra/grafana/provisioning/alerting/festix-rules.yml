apiVersion: 1

groups:
  - orgId: 1
    name: Festix Rules
    folder: Festix
    interval: 1m
    rules:
      - uid: festix-high-error-rate
        title: High error rate (5xx)
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              editorMode: code
              expr: sum by (service) (rate(http_requests_total{status=~"5.."}[5m])) / sum by (service) (rate(http_requests_total[5m]))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "High 5xx error ratio for {{ $labels.service }}"
        labels:
          severity: warning
        isPaused: true

      - uid: festix-high-p95-latency
        title: High p95 latency
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m])))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "High p95 latency for {{ $labels.service }}"
        labels:
          severity: warning
        isPaused: true
