services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: festix
      POSTGRES_PASSWORD: festix_secret
      POSTGRES_DB: festix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festix"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: festix
      RABBITMQ_DEFAULT_PASS: festix_secret
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: auth-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: festix
      POSTGRES_PASSWORD: festix_secret
      POSTGRES_DB: festix
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://festix:festix_secret@rabbitmq:5672
      JWT_SECRET: festix-docker-jwt-secret-key-32chars
      AUTH_SERVICE_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"

  event-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: event-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: festix
      POSTGRES_PASSWORD: festix_secret
      POSTGRES_DB: festix
      REDIS_URL: redis://redis:6379
      EVENT_SERVICE_PORT: 3002
      FRONTEND_URL: http://localhost:3100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3002:3002"
    volumes:
      - event_uploads:/app/uploads

  seat-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: seat-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: festix
      POSTGRES_PASSWORD: festix_secret
      POSTGRES_DB: festix
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://festix:festix_secret@rabbitmq:5672
      SEAT_SERVICE_PORT: 3003
      FRONTEND_URL: http://localhost:3100
      SEAT_LOCK_TTL: 300
      WAITING_ROOM_MAX_ACTIVE: 500
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3003:3003"

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: order-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: festix
      POSTGRES_PASSWORD: festix_secret
      POSTGRES_DB: festix
      RABBITMQ_URL: amqp://festix:festix_secret@rabbitmq:5672
      ORDER_SERVICE_PORT: 3004
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3004:3004"

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: payment-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: festix
      POSTGRES_PASSWORD: festix_secret
      POSTGRES_DB: festix
      RABBITMQ_URL: amqp://festix:festix_secret@rabbitmq:5672
      PAYMENT_SERVICE_PORT: 3005
      PAYMENT_FAILURE_RATE: 0.05
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3005:3005"

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: notification-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: festix
      POSTGRES_PASSWORD: festix_secret
      POSTGRES_DB: festix
      RABBITMQ_URL: amqp://festix:festix_secret@rabbitmq:5672
      NOTIFICATION_SERVICE_PORT: 3006
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "3006:3006"

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: queue-worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: festix
      POSTGRES_PASSWORD: festix_secret
      POSTGRES_DB: festix
      RABBITMQ_URL: amqp://festix:festix_secret@rabbitmq:5672
      SEAT_SERVICE_PORT: 3003
    depends_on:
      - order-service
      - payment-service
      - seat-service
      - rabbitmq

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: api-gateway
    environment:
      GATEWAY_PORT: 3000
      JWT_SECRET: festix-docker-jwt-secret-key-32chars
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
      EVENT_SERVICE_URL: http://event-service:3002
      SEAT_SERVICE_URL: http://seat-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      FRONTEND_URL: http://localhost:3100
    depends_on:
      - auth-service
      - event-service
      - seat-service
      - order-service
      - payment-service
      - notification-service
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api-gateway:3000/api
      NEXT_PUBLIC_WS_URL: http://seat-service:3003
    ports:
      - "3100:3100"
    depends_on:
      - api-gateway

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: festix
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3030:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  event_uploads:
  grafana_data:
